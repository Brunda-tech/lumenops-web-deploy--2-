server {
    listen 80;
    listen [::]:80;
    server_name lumenops.example.com www.lumenops.example.com;

    # Point root to the extracted dist/ folder
    root /var/www/lumenops/dist;
    index index.html;

    # Gzip compression for fast asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If running the Node.js Express backend (port 3000) for /api/* routes
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection 'upgrade';
    #     proxy_set_header Host $host;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
